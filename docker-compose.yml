version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: finances-db
    env_file:
      # A ordem de declaração importa. Os valores do último substituem os do primeiro se forem repetidos. 
      - backend/.env
      - backend/.env.docker
    environment:
      POSTGRES_DB: finances
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: finance-api-image:latest
    build:
      context: ./backend
      dockerfile: ./Dockerfile
    container_name: finance-api-container
    ports:
      - 8000:8000
    env_file:
      - backend/.env
      - backend/.env.docker
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app

  frontend:
    image: finance-frontend-image:latest
    build:
      context: ./frontend
      dockerfile: ./Dockerfile
    container_name: finance-frontend-container
    ports:
      - 3000:3000
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://backend:8000

volumes:
  postgres_data: